<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maria's PDF Tools</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <!-- Icon and name when the page is installed as an app (Add to Dock / Home Screen, Chrome “Install”) -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-title" content="PDF Tools">
  <meta name="theme-color" content="#fff5f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#23141c" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="vendor/pdf.min.js"></script>
  <script src="vendor/pdf-lib.min.js"></script>
  <script src="vendor/fontkit.umd.min.js"></script>
  <script src="vendor/jszip.min.js"></script>
  <script src="vendor/Sortable.min.js"></script>
  <script src="vendor/qrcode.min.js"></script>
  <script src="js/prefs.js"></script>
  <script src="js/i18n-bg.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/cats.js"></script>
  <script src="js/pals.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" title="All tools" data-i18n-title="All tools">
      <span class="cat" data-cat="main" data-size="2"></span>
      <span class="brand-name" data-i18n="Maria's PDF Tools">Maria's PDF Tools</span>
    </a>
    <nav class="crumbs" id="crumbs"></nav>
    <div class="spacer"></div>
    <button class="btn ghost icon-text" id="nextBtn" hidden title="Open this file in another tool" data-i18n-title="Open this file in another tool">↪<span class="hide-sm" data-i18n=" Other tool"> Other tool</span></button>
    <a class="btn ghost" href="#/" id="homeLink" hidden data-i18n="✿ All tools">✿ All tools</a>
    <button class="btn ghost lang-toggle" id="langBtn" title="Switch language" data-i18n-title="Switch language"></button>
    <button class="btn ghost icon-text" id="settingsBtn" title="Themes, layout and buddies" data-i18n-title="Themes, layout and buddies">🎀<span class="hide-sm" data-i18n=" Customize"> Customize</span></button>
  </header>

  <main id="app" class="app"></main>

  <div class="busy" id="busy" hidden>
    <div class="busy-box">
      <span class="cat bounce" data-cat="main" data-size="3"></span>
      <div><div id="busyText" data-i18n="Working…">Working…</div><div class="busy-sub" id="busySub"></div></div>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="hearts" id="hearts" aria-hidden="true"></div>
  <div class="pals" id="pals" aria-hidden="true"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
