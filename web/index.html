<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maria's PDF Tools</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="vendor/pdf.min.js"></script>
  <script src="vendor/pdf-lib.min.js"></script>
  <script src="vendor/fontkit.umd.min.js"></script>
  <script src="vendor/jszip.min.js"></script>
  <script src="vendor/Sortable.min.js"></script>
  <script src="vendor/qrcode.min.js"></script>
  <script src="js/prefs.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/cats.js"></script>
  <script src="js/pals.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" title="All tools">
      <span class="cat" data-cat="main" data-size="2"></span>
      <span class="brand-name">Maria's PDF Tools</span>
    </a>
    <nav class="crumbs" id="crumbs"></nav>
    <div class="spacer"></div>
    <a class="btn ghost" href="#/" id="homeLink" hidden>✿ All tools</a>
    <button class="btn ghost icon-text" id="settingsBtn" title="Themes, layout and buddies">🎀<span class="hide-sm"> Customize</span></button>
  </header>

  <main id="app" class="app"></main>

  <div class="busy" id="busy" hidden>
    <div class="busy-box">
      <span class="cat bounce" data-cat="main" data-size="3"></span>
      <div><div id="busyText">Working…</div><div class="busy-sub" id="busySub"></div></div>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="hearts" id="hearts" aria-hidden="true"></div>
  <div class="pals" id="pals" aria-hidden="true"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
